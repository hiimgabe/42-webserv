server {
    listen 8080 5050;
    server_name webserv-1;
    client_max_body_size 100;

    location / {
        root ./www;
        index index.html;
        methods GET;
        upload_store ./uploads;
    }

    location /cgi-bin {
        root ./www;
        methods GET POST;
        cgi_path /usr/bin/python3 /bin/bash;
        cgi_extension .py .sh .cgi;
        upload_store ./uploads;
    }

    location ~ \.bla$ {
        root ./www;
        methods POST;
        cgi_extension .bla;
        upload_store ./uploads;
    }

    location /post_body {
        root ./www;
        autoindex on;
        methods GET POST;
        upload_store ./uploads;
    }

    location /directory {
        root ./www/YoupiBanane;
        index youpi.bad_extension;
        methods GET;
    }

    location /assets {
        root ./www/assets;
        methods GET;
        autoindex on;
    }

    location /redirect {
        redirect 301 https://google.com;
        methods GET;
    }
}

server {
    listen 8000 5000;
    server_name webserv-2;
    client_max_body_size 1024;
    error_page 400 /error/400.html;

    location / {
        root ./www;
        index index.html;
        methods GET POST DELETE;
        upload_store ./uploads;
    }

    location ~ \.bla$ {
        root ./www;
        methods POST;
        cgi_extension .bla;
        upload_store ./uploads;
    }

    location /post_body {
        root ./www;
        methods POST;
        upload_store ./uploads;
    }

    location /directory {
        root ./www/YoupiBanane;
        index youpi.bad_extension;
        methods GET;
    }

    location /redirect {
        redirect 301 https://google.com;
        methods GET;
    }
}