<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Webserv Request Tester</title>
  <style>
    body { font-family: sans-serif; background: #1e1e1e; color: #e0e0e0; padding: 2rem; }
    input, textarea, button { width: 100%; margin: 0.5rem 0; padding: 0.5rem; border-radius: 4px; border: none; }
    textarea { height: 100px; }
    button { cursor: pointer; }
    #response { white-space: pre-wrap; background: #2e2e2e; padding: 1rem; margin-top: 1rem; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>🧪 Webserv HTTP Request Tester</h1>

  <label for="url">Request URL:</label>
  <input type="text" id="url" placeholder="http://localhost:8080/test">

  <label for="body">Request Body (for POST):</label>
  <textarea id="body" placeholder='{"key":"value"}'></textarea>

  <label for="method">Method:</label>
  <select id="method">
    <option>GET</option>
    <option>POST</option>
    <option>DELETE</option>
    <option>PUT</option>
  </select>

  <button onclick="sendRequest()">Send Request</button>
  
  <div id="response">Response will appear here...</div>

  <script>
    async function sendRequest() {
      const url = document.getElementById('url').value;
      const body = document.getElementById('body').value;
      const method = document.getElementById('method').value;
      const responseBox = document.getElementById('response');

      try {
        const options = {
          method,
          headers: {
            'Content-Type': 'application/json'
          }
        };
        if (method === 'POST' || method === 'PUT') {
          options.body = body;
        }
      
        const response = await fetch(url, options);
        const text = await response.text();
        responseBox.textContent = `Status: ${response.status} ${response.statusText}\n\nHeaders:\n${[...response.headers].map(([k,v])=>k+': '+v).join('\n')}\n\nBody:\n${text}`;
      } catch (err) {
        responseBox.textContent = `Error: ${err}`;
  }
    }
  </script>
</body>
</html>
